<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartHR | Add Employee</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 255, 255, 0.18), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(140, 0, 255, 0.20), transparent 30%),
                linear-gradient(135deg, #050816, #0b1026, #11183d);
        }


        /* =========================
           3D BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
            perspective: 1000px;
        }


        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.45;
            animation: float 9s ease-in-out infinite;
        }

        .orb1 {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 30% 30%, #00ffff, #0066ff, transparent 70%);
            top: 5%;
            left: 5%;
        }

        .orb2 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle at 30% 30%, #c000ff, #651fff, transparent 70%);
            bottom: -80px;
            right: 5%;
            animation-delay: 2s;
        }

        .orb3 {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 30% 30%, #00ff99, #0066ff, transparent 70%);
            top: 45%;
            right: 15%;
            animation-delay: 4s;
        }

        @keyframes float {

            0%, 100% {
                transform: translate3d(0, 0, 0) rotate(0deg);
            }

            50% {
                transform: translate3d(40px, -50px, 100px) rotate(180deg);
            }
        }


        /* =========================
           3D GRID
        ========================= */

        .grid {
            position: absolute;
            width: 160%;
            height: 60%;
            left: -30%;
            bottom: -15%;
            transform:
                perspective(600px)
                rotateX(65deg);

            background-image:
                linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);

            background-size: 55px 55px;

            animation: gridMove 8s linear infinite;
        }

        @keyframes gridMove {

            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 55px;
            }
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            position: relative;
            width: 100%;
            padding: 22px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(8, 13, 35, 0.45);
            backdrop-filter: blur(18px);

            border-bottom: 1px solid rgba(255,255,255,0.12);

            box-shadow:
                0 10px 40px rgba(0,0,0,0.25);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;

            background: linear-gradient(
                90deg,
                #00ffff,
                #6c63ff,
                #d946ef
            );

            -webkit-background-clip: text;
            color: transparent;

            text-shadow:
                0 0 25px rgba(0,255,255,0.3);
        }

        .nav-text {
            font-size: 14px;
            color: rgba(255,255,255,0.65);
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            min-height: calc(100vh - 80px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 50px 20px;
        }


        /* =========================
           GLASS CARD
        ========================= */

        .card {

            width: 100%;
            max-width: 900px;

            padding: 42px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.12),
                    rgba(255,255,255,0.04)
                );

            border: 1px solid rgba(255,255,255,0.16);

            border-radius: 28px;

            backdrop-filter: blur(25px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.45),
                inset 0 1px 1px rgba(255,255,255,0.12);

            transform:
                perspective(1200px)
                rotateX(2deg);

            animation: cardAppear 1s ease forwards;

            position: relative;
            overflow: hidden;
        }


        .card::before {

            content: "";

            position: absolute;

            width: 350px;
            height: 350px;

            top: -200px;
            right: -150px;

            background: radial-gradient(
                circle,
                rgba(0,255,255,0.22),
                transparent 70%
            );

            filter: blur(10px);
        }


        .card::after {

            content: "";

            position: absolute;

            width: 250px;
            height: 250px;

            bottom: -150px;
            left: -100px;

            background: radial-gradient(
                circle,
                rgba(160,0,255,0.18),
                transparent 70%
            );
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform:
                    perspective(1200px)
                    rotateX(15deg)
                    translateY(50px);
            }

            to {
                opacity: 1;
                transform:
                    perspective(1200px)
                    rotateX(2deg)
                    translateY(0);
            }
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            position: relative;
            z-index: 2;

            text-align: center;

            margin-bottom: 35px;
        }

        .header .icon {

            width: 70px;
            height: 70px;

            margin: auto;
            margin-bottom: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            font-size: 32px;

            background:
                linear-gradient(
                    145deg,
                    rgba(0,255,255,0.20),
                    rgba(100,0,255,0.20)
                );

            border: 1px solid rgba(255,255,255,0.15);

            box-shadow:
                0 15px 35px rgba(0,0,0,0.25),
                inset 0 0 20px rgba(0,255,255,0.08);

            transform:
                perspective(500px)
                rotateY(-10deg);

            transition: 0.4s;
        }

        .icon:hover {
            transform:
                perspective(500px)
                rotateY(15deg)
                rotateX(10deg)
                scale(1.08);
        }

        .header h1 {

            font-size: 32px;
            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #8be9ff
                );

            -webkit-background-clip: text;
            color: transparent;
        }

        .header p {
            color: rgba(255,255,255,0.55);
            font-size: 14px;
        }


        /* =========================
           FORM
        ========================= */

        .form-grid {

            position: relative;
            z-index: 2;

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 22px;
        }

        .form-group {
            position: relative;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 600;

            color: rgba(255,255,255,0.8);

            letter-spacing: 0.3px;
        }


        input,
        select {

            width: 100%;

            padding: 14px 16px;

            border-radius: 13px;

            border: 1px solid rgba(255,255,255,0.12);

            outline: none;

            color: white;

            background:
                rgba(5,10,30,0.55);

            backdrop-filter: blur(10px);

            transition: all 0.3s ease;

            font-size: 14px;

            box-shadow:
                inset 0 1px 1px rgba(255,255,255,0.04);
        }

        input::placeholder {
            color: rgba(255,255,255,0.32);
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #111936;
            color: white;
        }


        input:hover,
        select:hover {

            border-color: rgba(0,255,255,0.35);

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.20);
        }


        input:focus,
        select:focus {

            border-color: #00ffff;

            box-shadow:
                0 0 0 3px rgba(0,255,255,0.08),
                0 0 25px rgba(0,255,255,0.12);

            transform:
                translateY(-2px);
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {

            position: relative;
            z-index: 2;

            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 32px;
        }

        button {

            border: none;

            padding: 14px 28px;

            border-radius: 13px;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.35s;

            letter-spacing: 0.3px;
        }


        .save {

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #00bcd4,
                    #6366f1,
                    #9333ea
                );

            box-shadow:
                0 10px 30px rgba(99,102,241,0.30);
        }

        .save:hover {

            transform:
                translateY(-4px)
                scale(1.03);

            box-shadow:
                0 18px 40px rgba(0,220,255,0.25);
        }


        .back {

            color: rgba(255,255,255,0.8);

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid rgba(255,255,255,0.12);
        }

        .back:hover {

            transform:
                translateY(-4px);

            background:
                rgba(255,255,255,0.12);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 18px 25px;
            }

            .logo {
                font-size: 23px;
            }

            .nav-text {
                display: none;
            }

            .card {
                padding: 28px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: 1;
            }

            .header h1 {
                font-size: 26px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

    </style>

</head>


<body>


    <!-- 3D BACKGROUND -->

    <div class="background">

        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>

        <div class="grid"></div>

    </div>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            SmartHR
        </div>

        <div class="nav-text">
            Employee Management System
        </div>

    </nav>


    <!-- MAIN -->

    <main class="main">

        <div class="card">


            <!-- HEADER -->

            <div class="header">

                <div class="icon">
                    👤
                </div>

                <h1>
                    Add New Employee
                </h1>

                <p>
                    Enter employee information to add them to SmartHR
                </p>

            </div>


            <!-- FORM -->

            <form method="POST">

                {% csrf_token %}

                <div class="form-grid">


                    <!-- EMPLOYEE ID -->

                    <div class="form-group">

                        <label>
                            Employee ID
                        </label>

                        <input
                            type="text"
                            name="employee_id"
                            placeholder="e.g. EMP001"
                            required
                        >

                    </div>


                    <!-- NAME -->

                    <div class="form-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            placeholder="Enter employee name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            placeholder="employee@example.com"
                            required
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="form-group">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="text"
                            name="phone"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>


                    <!-- DEPARTMENT -->

                    <div class="form-group">

                        <label>
                            Department
                        </label>

                        <select
                            name="department"
                            required
                        >

                            <option value="">
                                Select Department
                            </option>

                            <option value="HR">
                                Human Resources
                            </option>

                            <option value="IT">
                                Information Technology
                            </option>

                            <option value="Finance">
                                Finance
                            </option>

                            <option value="Accounting">
                                Accounting
                            </option>

                            <option value="Sales">
                                Sales
                            </option>

                            <option value="Marketing">
                                Marketing
                            </option>

                            <option value="Operations">
                                Operations
                            </option>

                            <option value="Administration">
                                Administration
                            </option>

                            <option value="Customer Support">
                                Customer Support
                            </option>

                            <option value="Research & Development">
                                Research & Development
                            </option>

                            <option value="Production">
                                Production
                            </option>

                            <option value="Quality Assurance">
                                Quality Assurance
                            </option>

                            <option value="Legal">
                                Legal
                            </option>

                            <option value="Procurement">
                                Procurement
                            </option>

                            <option value="Supply Chain">
                                Supply Chain
                            </option>

                            <option value="Engineering">
                                Engineering
                            </option>

                            <option value="Design">
                                Design
                            </option>

                            <option value="Security">
                                Security
                            </option>

                            <option value="Management">
                                Management
                            </option>

                        </select>

                    </div>


                    <!-- DESIGNATION -->

                    <div class="form-group">

                        <label>
                            Designation
                        </label>

                        <select
                            name="designation"
                            required
                        >

                            <option value="">
                                Select Designation
                            </option>

                            <option value="CEO">
                                Chief Executive Officer
                            </option>

                            <option value="CTO">
                                Chief Technology Officer
                            </option>

                            <option value="CFO">
                                Chief Financial Officer
                            </option>

                            <option value="COO">
                                Chief Operating Officer
                            </option>

                            <option value="HR Manager">
                                HR Manager
                            </option>

                            <option value="HR Executive">
                                HR Executive
                            </option>

                            <option value="Project Manager">
                                Project Manager
                            </option>

                            <option value="Team Lead">
                                Team Lead
                            </option>

                            <option value="Software Engineer">
                                Software Engineer
                            </option>

                            <option value="Software Developer">
                                Software Developer
                            </option>

                            <option value="Web Developer">
                                Web Developer
                            </option>

                            <option value="Frontend Developer">
                                Frontend Developer
                            </option>

                            <option value="Backend Developer">
                                Backend Developer
                            </option>

                            <option value="Full Stack Developer">
                                Full Stack Developer
                            </option>

                            <option value="Python Developer">
                                Python Developer
                            </option>

                            <option value="Data Analyst">
                                Data Analyst
                            </option>

                            <option value="Data Scientist">
                                Data Scientist
                            </option>

                            <option value="Business Analyst">
                                Business Analyst
                            </option>

                            <option value="DevOps Engineer">
                                DevOps Engineer
                            </option>

                            <option value="Cloud Engineer">
                                Cloud Engineer
                            </option>

                            <option value="QA Engineer">
                                QA Engineer
                            </option>

                            <option value="System Administrator">
                                System Administrator
                            </option>

                            <option value="UI/UX Designer">
                                UI/UX Designer
                            </option>

                            <option value="Graphic Designer">
                                Graphic Designer
                            </option>

                            <option value="Accountant">
                                Accountant
                            </option>

                            <option value="Finance Manager">
                                Finance Manager
                            </option>

                            <option value="Sales Executive">
                                Sales Executive
                            </option>

                            <option value="Sales Manager">
                                Sales Manager
                            </option>

                            <option value="Marketing Executive">
                                Marketing Executive
                            </option>

                            <option value="Marketing Manager">
                                Marketing Manager
                            </option>

                            <option value="Customer Support Executive">
                                Customer Support Executive
                            </option>

                            <option value="Business Development Executive">
                                Business Development Executive
                            </option>

                            <option value="Operations Manager">
                                Operations Manager
                            </option>

                            <option value="Operations Executive">
                                Operations Executive
                            </option>

                            <option value="Intern">
                                Intern
                            </option>

                            <option value="Trainee">
                                Trainee
                            </option>

                        </select>

                    </div>


                    <!-- JOINING DATE -->

                    <div class="form-group">

                        <label>
                            Joining Date
                        </label>

                        <input
                            type="date"
                            name="joining_date"
                            required
                        >

                    </div>


                    <!-- SALARY -->

                    <div class="form-group">

                        <label>
                            Salary (₹)
                        </label>

                        <input
                            type="number"
                            name="salary"
                            placeholder="Enter salary"
                            step="0.01"
                            required
                        >

                    </div>


                </div>


                <!-- BUTTONS -->

                <div class="buttons">

                    <button
                        type="submit"
                        class="save"
                    >
                        ✨ Add Employee
                    </button>


                    <button
                        type="button"
                        class="back"
                        onclick="history.back()"
                    >
                        ← Back
                    </button>

                </div>

            </form>

        </div>

    </main>


</body>

</html>
