<title>SmartHR | Login</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;

        background:
            radial-gradient(circle at 15% 20%, rgba(0, 174, 255, 0.22), transparent 30%),
            radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.25), transparent 30%),
            linear-gradient(135deg, #020617, #07112d, #050816);
    }

    /* =========================
       ANIMATED BACKGROUND
    ========================= */

    .background {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: -2;
    }

    .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: .35;
        animation: moveGlow 10s ease-in-out infinite alternate;
    }

    .glow.one {
        width: 350px;
        height: 350px;
        background: #00aaff;
        top: -120px;
        left: -100px;
    }

    .glow.two {
        width: 400px;
        height: 400px;
        background: #7c3aed;
        right: -150px;
        bottom: -150px;
        animation-delay: 2s;
    }

    @keyframes moveGlow {
        0% {
            transform: translate(0, 0) scale(1);
        }

        100% {
            transform: translate(100px, 70px) scale(1.3);
        }
    }

    /* Floating particles */

    .particle {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #60a5fa;
        box-shadow: 0 0 15px #60a5fa;
        animation: particleMove linear infinite;
    }

    .p1 { left: 8%; top: 80%; animation-duration: 8s; }
    .p2 { left: 18%; top: 30%; animation-duration: 11s; }
    .p3 { left: 35%; top: 85%; animation-duration: 9s; }
    .p4 { left: 72%; top: 20%; animation-duration: 12s; }
    .p5 { left: 88%; top: 65%; animation-duration: 10s; }
    .p6 { left: 55%; top: 10%; animation-duration: 7s; }

    @keyframes particleMove {
        0% {
            transform: translateY(0);
            opacity: 0;
        }

        20% {
            opacity: 1;
        }

        80% {
            opacity: 1;
        }

        100% {
            transform: translateY(-180px);
            opacity: 0;
        }
    }

    /* =========================
       3D OFFICE SCENE
    ========================= */

    .scene {
        position: absolute;
        left: 8%;
        bottom: 7%;
        width: 420px;
        height: 330px;
        perspective: 1000px;
        animation: sceneFloat 5s ease-in-out infinite;
    }

    @keyframes sceneFloat {
        0%, 100% {
            transform: translateY(0) rotateY(-3deg);
        }

        50% {
            transform: translateY(-12px) rotateY(3deg);
        }
    }

    /* Desk */

    .desk {
        position: absolute;
        bottom: 55px;
        left: 35px;
        width: 350px;
        height: 25px;
        border-radius: 8px;

        background: linear-gradient(
            145deg,
            #334155,
            #111827
        );

        box-shadow:
            0 15px 30px rgba(0,0,0,.45),
            inset 0 1px rgba(255,255,255,.2);

        transform: rotateX(55deg);
    }

    .desk-leg {
        position: absolute;
        bottom: 0;
        width: 14px;
        height: 75px;
        background: #111827;
        border-radius: 5px;
    }

    .leg-one {
        left: 70px;
    }

    .leg-two {
        right: 70px;
    }

    /* Laptop */

    .laptop {
        position: absolute;
        bottom: 90px;
        left: 125px;
        width: 170px;
        height: 110px;

        transform: perspective(700px) rotateX(8deg);

        background: linear-gradient(
            145deg,
            #1e293b,
            #020617
        );

        border: 5px solid #334155;
        border-radius: 10px;

        box-shadow:
            0 20px 35px rgba(0,0,0,.5),
            0 0 30px rgba(59,130,246,.15);
    }

    .screen {
        position: absolute;
        inset: 9px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 5px;

        background:
            radial-gradient(
                circle,
                rgba(59,130,246,.25),
                transparent 65%
            ),
            #020617;

        overflow: hidden;
    }

    .screen-logo {
        font-size: 27px;
        font-weight: 800;
        letter-spacing: 1px;

        background: linear-gradient(
            90deg,
            #38bdf8,
            #818cf8
        );

        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;

        animation: logoGlow 2s ease-in-out infinite alternate;
    }

    @keyframes logoGlow {
        from {
            filter: drop-shadow(0 0 2px #38bdf8);
        }

        to {
            filter: drop-shadow(0 0 15px #818cf8);
        }
    }

    /* Employee */

    .employee {
        position: absolute;
        bottom: 77px;
        right: 15px;
        width: 115px;
        height: 220px;

        animation: employeeFloat 4s ease-in-out infinite;
    }

    @keyframes employeeFloat {
        0%, 100% {
            transform: translateY(0) rotateY(0);
        }

        50% {
            transform: translateY(-8px) rotateY(-5deg);
        }
    }

    .head {
        position: absolute;
        top: 0;
        left: 25px;

        width: 65px;
        height: 65px;
        border-radius: 50%;

        background: #f5c7a9;

        box-shadow:
            inset -7px -5px 0 rgba(0,0,0,.08),
            0 10px 20px rgba(0,0,0,.3);
    }

    .hair {
        position: absolute;
        top: -4px;
        left: 19px;

        width: 75px;
        height: 35px;

        background: #172033;
        border-radius: 50% 50% 35% 20%;
    }

    .eye {
        position: absolute;
        top: 28px;
        width: 6px;
        height: 6px;
        background: #111827;
        border-radius: 50%;
    }

    .eye.left {
        left: 20px;
    }

    .eye.right {
        right: 20px;
    }

    .body {
        position: absolute;
        top: 62px;
        left: 10px;

        width: 95px;
        height: 115px;

        border-radius: 30px 30px 12px 12px;

        background:
            linear-gradient(
                145deg,
                #2563eb,
                #4338ca
            );

        box-shadow:
            0 15px 30px rgba(0,0,0,.4),
            inset 0 1px rgba(255,255,255,.25);
    }

    .shirt-logo {
        position: absolute;
        top: 35px;
        left: 30px;

        font-size: 17px;
        font-weight: bold;
        color: white;
    }

    .arm {
        position: absolute;
        width: 24px;
        height: 90px;

        background: #f5c7a9;
        border-radius: 20px;
    }

    .arm.left {
        top: 75px;
        left: -5px;
        transform: rotate(25deg);
    }

    .arm.right {
        top: 75px;
        right: -5px;
        transform: rotate(-25deg);
    }

    .speech {
        position: absolute;
        top: -55px;
        right: -50px;

        padding: 13px 18px;
        border-radius: 15px;

        background: rgba(255,255,255,.1);
        border: 1px solid rgba(255,255,255,.2);
        backdrop-filter: blur(15px);

        color: #dbeafe;
        font-size: 13px;
        font-weight: 600;

        box-shadow: 0 15px 35px rgba(0,0,0,.25);

        animation: speechFloat 3s ease-in-out infinite;
    }

    .speech::after {
        content: "";
        position: absolute;
        bottom: -7px;
        left: 25px;

        width: 14px;
        height: 14px;

        background: rgba(255,255,255,.1);
        transform: rotate(45deg);
    }

    @keyframes speechFloat {
        0%, 100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-8px);
        }
    }

    /* =========================
       LOGIN CARD
    ========================= */

    .login-wrapper {
        width: 430px;
        margin-left: 420px;

        perspective: 1200px;
    }

    .login-card {
        position: relative;

        padding: 42px;

        border-radius: 28px;

        background:
            linear-gradient(
                145deg,
                rgba(255,255,255,.13),
                rgba(255,255,255,.045)
            );

        border: 1px solid rgba(255,255,255,.16);

        backdrop-filter: blur(25px);

        box-shadow:
            0 35px 80px rgba(0,0,0,.45),
            inset 0 1px rgba(255,255,255,.2);

        animation: cardEntry 1s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes cardEntry {
        from {
            opacity: 0;
            transform:
                translateY(60px)
                rotateX(15deg)
                scale(.92);
        }

        to {
            opacity: 1;
            transform:
                translateY(0)
                rotateX(0)
                scale(1);
        }
    }

    .login-card::before {
        content: "";

        position: absolute;
        width: 170px;
        height: 170px;

        right: -70px;
        top: -70px;

        border-radius: 50%;

        background: #2563eb;
        filter: blur(70px);
        opacity: .22;
    }

    /* Logo */

    .brand {
        text-align: center;
        margin-bottom: 30px;
    }

    .brand-icon {
        width: 70px;
        height: 70px;

        margin: auto;
        margin-bottom: 15px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 22px;

        font-size: 32px;
        font-weight: 900;

        background:
            linear-gradient(
                145deg,
                #2563eb,
                #7c3aed
            );

        box-shadow:
            0 15px 35px rgba(37,99,235,.35),
            inset 0 1px rgba(255,255,255,.4);

        transform:
            perspective(500px)
            rotateX(8deg);

        animation: iconFloat 3s ease-in-out infinite;
    }

    @keyframes iconFloat {
        0%, 100% {
            transform:
                perspective(500px)
                rotateX(8deg)
                translateY(0);
        }

        50% {
            transform:
                perspective(500px)
                rotateX(-5deg)
                translateY(-7px);
        }
    }

    .brand h1 {
        font-size: 29px;
        letter-spacing: 1px;
    }

    .brand h1 span {
        color: #60a5fa;
    }

    .brand p {
        color: #94a3b8;
        font-size: 14px;
        margin-top: 7px;
    }

    /* Inputs */

    .input-group {
        position: relative;
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;

        color: #cbd5e1;
        font-size: 13px;
        font-weight: 600;

        margin-bottom: 8px;
    }

    .input-box {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;

        transform: translateY(-50%);

        font-size: 18px;
        opacity: .8;
    }

    input {
        width: 100%;

        padding: 15px 15px 15px 45px;

        border: 1px solid rgba(255,255,255,.12);
        border-radius: 13px;

        outline: none;

        color: white;
        background: rgba(2,6,23,.55);

        transition: .3s;
    }

    input::placeholder {
        color: #64748b;
    }

    input:focus {
        border-color: #3b82f6;

        background: rgba(15,23,42,.8);

        box-shadow:
            0 0 0 4px rgba(59,130,246,.12),
            0 0 25px rgba(59,130,246,.08);

        transform: translateY(-2px);
    }

    /* Error */

    .error {
        margin-bottom: 18px;
        padding: 11px 13px;

        border-radius: 10px;

        color: #fca5a5;
        background: rgba(239,68,68,.1);
        border: 1px solid rgba(239,68,68,.2);

        font-size: 13px;
        text-align: center;
    }

    /* Button */

    .login-btn {
        width: 100%;

        padding: 15px;

        border: none;
        border-radius: 13px;

        color: white;

        font-size: 15px;
        font-weight: 700;

        cursor: pointer;

        background:
            linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

        box-shadow:
            0 12px 30px rgba(37,99,235,.3);

        transition: .3s;

        position: relative;
        overflow: hidden;
    }

    .login-btn::before {
        content: "";

        position: absolute;

        top: 0;
        left: -100%;

        width: 100%;
        height: 100%;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.25),
                transparent
            );

        transition: .6s;
    }

    .login-btn:hover::before {
        left: 100%;
    }

    .login-btn:hover {
        transform: translateY(-4px);

        box-shadow:
            0 18px 40px rgba(37,99,235,.4),
            0 0 25px rgba(124,58,237,.2);
    }

    .login-btn:active {
        transform: translateY(-1px) scale(.99);
    }

    .footer {
        margin-top: 25px;

        text-align: center;

        color: #64748b;
        font-size: 12px;
    }

    .footer strong {
        color: #60a5fa;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1000px) {

        body {
            overflow-y: auto;
        }

        .scene {
            display: none;
        }

        .login-wrapper {
            margin-left: 0;
            width: min(430px, 92%);
        }
    }

    @media (max-width: 500px) {

        .login-card {
            padding: 30px 22px;
        }

        .brand h1 {
            font-size: 25px;
        }
    }
</style>

<body>

```
<!-- BACKGROUND -->

<div class="background">

    <div class="glow one"></div>
    <div class="glow two"></div>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>

</div>


<!-- 3D EMPLOYEE SCENE -->

<div class="scene">

    <div class="speech">
        👋 Welcome to SmartHR
    </div>

    <div class="employee">

        <div class="hair"></div>

        <div class="head">
            <div class="eye left"></div>
            <div class="eye right"></div>
        </div>

        <div class="body">
            <div class="shirt-logo">HR</div>
        </div>

        <div class="arm left"></div>
        <div class="arm right"></div>

    </div>


    <div class="laptop">

        <div class="screen">
            <div class="screen-logo">
                SmartHR
            </div>
        </div>

    </div>


    <div class="desk"></div>

    <div class="desk-leg leg-one"></div>
    <div class="desk-leg leg-two"></div>

</div>


<!-- LOGIN -->

<div class="login-wrapper">

    <div class="login-card">

        <div class="brand">

            <div class="brand-icon">
                S
            </div>

            <h1>
                Smart<span>HR</span>
            </h1>

            <p>
                Smart Employee Management System
            </p>

        </div>


        {% if error %}

            <div class="error">
                ⚠ {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="input-group">

                <label>
                    Username
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                    >

                </div>

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        🔐
                    </span>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >

                </div>

            </div>


            <button
                type="submit"
                class="login-btn">

                Login to SmartHR →

            </button>

        </form>


        <div class="footer">
            Secure HR Management •
            <strong>SmartHR</strong>
        </div>

    </div>

</div>


</body>
</html>
