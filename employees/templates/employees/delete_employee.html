<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartHR | Delete Employee</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background:
                radial-gradient(circle at 15% 20%, rgba(0, 153, 255, 0.28), transparent 30%),
                radial-gradient(circle at 85% 75%, rgba(139, 92, 246, 0.25), transparent 30%),
                linear-gradient(135deg, #030712, #071329, #050816);

            color: white;
        }

        /* =========================
           MOVING BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -2;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(4px);
            opacity: 0.55;
            animation: float 10s ease-in-out infinite alternate;
        }

        .orb1 {
            width: 260px;
            height: 260px;
            background: #2563eb;
            top: -100px;
            left: -80px;
            box-shadow: 0 0 100px #2563eb;
        }

        .orb2 {
            width: 220px;
            height: 220px;
            background: #7c3aed;
            right: -70px;
            bottom: -60px;
            animation-delay: 2s;
            box-shadow: 0 0 100px #7c3aed;
        }

        .orb3 {
            width: 100px;
            height: 100px;
            background: #ef4444;
            top: 20%;
            right: 20%;
            opacity: 0.25;
            animation-delay: 4s;
            box-shadow: 0 0 70px #ef4444;
        }

        .orb4 {
            width: 80px;
            height: 80px;
            background: #38bdf8;
            bottom: 15%;
            left: 15%;
            opacity: 0.25;
            animation-delay: 1s;
            box-shadow: 0 0 60px #38bdf8;
        }

        @keyframes float {

            0% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1)
                    rotate(0deg);
            }

            50% {
                transform:
                    translate3d(100px, -70px, 0)
                    scale(1.15)
                    rotate(90deg);
            }

            100% {
                transform:
                    translate3d(-60px, 80px, 0)
                    scale(0.9)
                    rotate(180deg);
            }
        }

        /* =========================
           FLOATING 3D PARTICLES
        ========================= */

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #60a5fa;
            border-radius: 50%;
            box-shadow: 0 0 15px #60a5fa;
            animation: particleMove 7s linear infinite;
        }

        .p1 {
            left: 10%;
            bottom: -10px;
        }

        .p2 {
            left: 30%;
            bottom: -20px;
            animation-delay: 2s;
        }

        .p3 {
            left: 55%;
            bottom: -20px;
            animation-delay: 4s;
        }

        .p4 {
            left: 80%;
            bottom: -20px;
            animation-delay: 1s;
        }

        @keyframes particleMove {

            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) scale(0.3);
                opacity: 0;
            }
        }

        /* =========================
           MAIN 3D CARD
        ========================= */

        .scene {
            perspective: 1200px;
            width: 100%;
            max-width: 550px;
            padding: 25px;
        }

        .delete-card {

            position: relative;

            padding: 45px 40px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.13),
                    rgba(255,255,255,0.04)
                );

            border: 1px solid rgba(255,255,255,0.15);

            backdrop-filter: blur(25px);

            box-shadow:
                0 35px 80px rgba(0,0,0,0.45),
                inset 0 1px 1px rgba(255,255,255,0.2);

            text-align: center;

            animation:
                cardEntrance 1s cubic-bezier(.2,.8,.2,1),
                cardFloat 5s ease-in-out 1s infinite;

            transform-style: preserve-3d;
        }

        @keyframes cardEntrance {

            from {
                opacity: 0;
                transform:
                    translateY(80px)
                    rotateX(25deg)
                    rotateY(-10deg)
                    scale(0.8);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    rotateX(0)
                    rotateY(0)
                    scale(1);
            }
        }

        @keyframes cardFloat {

            0%, 100% {
                transform: translateY(0) rotateX(0deg);
            }

            50% {
                transform: translateY(-8px) rotateX(1deg);
            }
        }

        /* Card glow */

        .delete-card::before {

            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            background: rgba(239,68,68,0.18);

            border-radius: 50%;

            filter: blur(45px);

            top: -90px;
            right: -70px;

            pointer-events: none;
        }

        .delete-card::after {

            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            background: rgba(37,99,235,0.15);

            border-radius: 50%;

            filter: blur(40px);

            bottom: -70px;
            left: -60px;

            pointer-events: none;
        }

        /* =========================
           WARNING ICON
        ========================= */

        .warning {

            width: 90px;
            height: 90px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 42px;

            background:
                linear-gradient(
                    145deg,
                    rgba(239,68,68,0.25),
                    rgba(127,29,29,0.35)
                );

            border: 1px solid rgba(248,113,113,0.4);

            box-shadow:
                0 0 35px rgba(239,68,68,0.25),
                inset 0 1px 2px rgba(255,255,255,0.2);

            animation: warningPulse 2s ease-in-out infinite;

            transform: translateZ(40px);
        }

        @keyframes warningPulse {

            0%, 100% {
                transform: translateZ(40px) scale(1);
                box-shadow:
                    0 0 25px rgba(239,68,68,0.2);
            }

            50% {
                transform: translateZ(40px) scale(1.08);
                box-shadow:
                    0 0 55px rgba(239,68,68,0.45);
            }
        }

        /* =========================
           TEXT
        ========================= */

        h1 {

            font-size: 32px;

            margin-bottom: 12px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #f87171,
                    #a78bfa
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {

            color: #94a3b8;

            font-size: 15px;

            margin-bottom: 25px;
        }

        /* =========================
           EMPLOYEE INFO
        ========================= */

        .employee-box {

            padding: 20px;

            margin: 20px 0 30px;

            border-radius: 16px;

            background: rgba(255,255,255,0.05);

            border: 1px solid rgba(255,255,255,0.08);

            text-align: left;

            transform: translateZ(25px);

            transition: 0.3s;
        }

        .employee-box:hover {

            transform:
                translateZ(40px)
                scale(1.02);

            background: rgba(255,255,255,0.08);

            box-shadow:
                0 15px 35px rgba(0,0,0,0.25);
        }

        .employee-name {

            font-size: 22px;

            font-weight: 700;

            margin-bottom: 8px;

            color: #f8fafc;
        }

        .employee-id {

            color: #60a5fa;

            font-size: 14px;

            letter-spacing: 0.5px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .actions {

            display: flex;

            justify-content: center;

            gap: 14px;

            margin-top: 25px;
        }

        .btn {

            text-decoration: none;

            border: none;

            cursor: pointer;

            padding: 13px 22px;

            border-radius: 12px;

            color: white;

            font-size: 14px;

            font-weight: 700;

            transition: all 0.3s ease;

            transform: translateZ(30px);
        }

        .delete-btn {

            background:
                linear-gradient(
                    145deg,
                    #ef4444,
                    #b91c1c
                );

            box-shadow:
                0 10px 25px rgba(239,68,68,0.25);
        }

        .cancel-btn {

            background:
                linear-gradient(
                    145deg,
                    #334155,
                    #1e293b
                );

            box-shadow:
                0 10px 25px rgba(0,0,0,0.25);
        }

        .btn:hover {

            transform:
                translateY(-5px)
                translateZ(40px)
                scale(1.04);

            box-shadow:
                0 18px 35px rgba(0,0,0,0.4);
        }

        .delete-btn:hover {

            box-shadow:
                0 18px 35px rgba(239,68,68,0.4);
        }

        /* =========================
           BACK LINK
        ========================= */

        .back {

            display: inline-block;

            margin-top: 25px;

            color: #94a3b8;

            text-decoration: none;

            font-size: 13px;

            transition: 0.3s;
        }

        .back:hover {

            color: #60a5fa;

            transform: translateX(-4px);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .scene {
                padding: 15px;
            }

            .delete-card {
                padding: 35px 22px;
            }

            h1 {
                font-size: 26px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <!-- Animated Background -->

    <div class="background">

        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
        <div class="orb orb4"></div>

        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>

    </div>


    <!-- 3D Scene -->

    <div class="scene">

        <div class="delete-card">

            <!-- Warning -->

            <div class="warning">
                ⚠
            </div>


            <h1>Delete Employee?</h1>

            <p class="subtitle">
                This action will permanently remove this employee
                from the SmartHR database.
            </p>


            <!-- Employee Information -->

            <div class="employee-box">

                <div class="employee-name">
                    {{ employee.name }}
                </div>

                <div class="employee-id">
                    Employee ID: {{ employee.employee_id }}
                </div>

            </div>


            <!-- Buttons -->

            <div class="actions">

                <form method="POST" style="margin:0;">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn delete-btn">

                        🗑 Yes, Delete

                    </button>

                </form>


                <a
                    href="{% url 'dashboard' %}"
                    class="btn cancel-btn">

                    ← Cancel

                </a>

            </div>


            <a
                href="{% url 'dashboard' %}"
                class="back">

                ← Back to Dashboard

            </a>

        </div>

    </div>

</body>
</html>
